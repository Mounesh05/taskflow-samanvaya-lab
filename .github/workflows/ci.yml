name: TaskFlow CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "ci/**"
      - pilot/coverage-evidence-20261126-base
      - pilot/coverage-evidence-20261126-head
      - pilot/mixed-quality-ci-20261126

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    env:
      TASKFLOW_TEST_MONGO_URI: mongodb://localhost:27017

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff
        working-directory: backend
        run: |
          python -m ruff check app tests

      - name: Run backend tests with coverage
        env:
          PYTHONPATH: backend
        run: |
          python -m coverage run -m pytest backend/tests -v \
            --junitxml=backend/pytest-results.xml

      - name: Export backend coverage
        if: always()
        run: python -m coverage json -o backend/coverage.json

      - name: Audit exact installed Python dependencies
        run: |
          mkdir -p backend/quality-reports
          python -m pip freeze > "$RUNNER_TEMP/taskflow-freeze.txt"
          pipx install pip-audit==2.9.0
          rc=0
          pip-audit --disable-pip --no-deps -r "$RUNNER_TEMP/taskflow-freeze.txt" -f json -o backend/quality-reports/pip-audit.json || rc=$?
          test "$rc" -le 1
          python - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path(".")
          inputs = {p: hashlib.sha256((root/p).read_bytes()).hexdigest() for p in
                    ("backend/requirements.txt", "backend/requirements-dev.txt")}
          report = {"audit": {"tool": "pip-audit", "inputs": inputs}}
          (root/"backend/quality-reports/quality-evidence.json").write_text(json.dumps(report))
          PY
          cp backend/coverage.json backend/pytest-results.xml backend/quality-reports/

      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.run_attempt == 1 && 'backend-test-results' || format('backend-test-results-{0}-{1}', github.run_id, github.run_attempt) }}
          path: backend/quality-reports/
          if-no-files-found: warn

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test with line coverage and JUnit
        run: |
          npm install --no-save --ignore-scripts --package-lock=false @vitest/coverage-v8@3.2.7
          mkdir -p quality-reports
          npm test -- --coverage --coverage.provider=v8 --coverage.reporter=json-summary --reporter=junit --outputFile=quality-reports/vitest.xml
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          const report = JSON.parse(fs.readFileSync('coverage/coverage-summary.json'));
          const relative = Object.fromEntries(Object.entries(report).map(([file, value]) =>
            [file === 'total' ? file : path.relative(process.env.GITHUB_WORKSPACE, file), value]));
          fs.writeFileSync('quality-reports/coverage-summary.json', JSON.stringify(relative));
          JS


      - name: Typecheck and build
        run: npm run build
      - name: Audit locked npm dependencies and record checked TypeScript files
        run: |
          rc=0
          npm audit --json --package-lock-only > quality-reports/npm-audit.json || rc=$?
          test "$rc" -le 1
          ./node_modules/.bin/tsc --noEmit --listFiles > "$RUNNER_TEMP/taskflow-checked.txt"
          python - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          current = pathlib.Path.cwd()
          def inputs(names):
              return {name: hashlib.sha256((root/name).read_bytes()).hexdigest() for name in names}
          files = []
          for line in (pathlib.Path(os.environ["RUNNER_TEMP"])/"taskflow-checked.txt").read_text().splitlines():
              path = pathlib.Path(line)
              if path.is_relative_to(current) and "node_modules" not in path.parts:
                  files.append(path.relative_to(root).as_posix())
          report = {"audit": {"tool": "npm-audit", "inputs": inputs(["frontend/package-lock.json", "frontend/package.json"])},
                    "typecheck": {"tool": "tsc", "exit_code": 0, "inputs": inputs(["frontend/tsconfig.json"]), "files": sorted(files)}}
          pathlib.Path("quality-reports/quality-evidence.json").write_text(json.dumps(report))
          PY

      - name: Upload frontend test results
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: frontend/quality-reports/
          if-no-files-found: error
